# Pruebas automatizadas de la aplicación (Playwright), en Docker.
#
# Se arranca desde el tablero «Pruebas automatizadas» de la aplicación (o a mano: Actions → Run workflow).
# Usa las mismas imágenes de docker-compose.yml que cualquier computadora: la aplicación («aplicacion») y las
# pruebas («pruebas»). El tablero sigue el avance por el nombre de los pasos («Preparar…», «Ejecutar…»,
# «Publicar…»): si se cambian, se cambia también LISTA_ETAPA en agentes/pruebas/pruebas_service.py.
# Las opciones de «alcance» son las del catálogo agentes/pruebas/catalogo_pruebas.py (lo revisa una prueba).
#
# Si hay casos fallidos y el repositorio tiene el secret OPENCODE_API_KEY, el Agente de Pruebas explica por qué
# fallaron: abre la aplicación con un navegador por Playwright MCP y deja su diagnóstico en cada caso.
name: Pruebas automatizadas

run-name: >-
  Pruebas ${{ inputs.numero || 'manual' }} · ${{ inputs.alcance }} · ${{ inputs.ambiente }} [${{ inputs.ejecucion }}]

on:
  workflow_dispatch:
    inputs:
      ejecucion:
        description: Identificador de la ejecución (lo pone la aplicación)
        required: false
        default: manual
      numero:
        description: Número legible de la ejecución (lo pone la aplicación)
        required: false
        default: ''
      alcance:
        description: Qué probar
        type: choice
        default: regresion
        options:
          - regresion
          - basicas
          - inicio-sesion
          - notificaciones
          - historias
          - crear-historia
          - cambios
          - exportar
          - mantenimiento
          - usuarios
          - roles
          - pruebas
          - consumo
      navegador:
        description: Navegador
        type: choice
        default: chromium
        options:
          - chromium
          - firefox
          - webkit
      ambiente:
        description: Ambiente (producción solo admite las básicas)
        type: choice
        default: pruebas
        options:
          - pruebas
          - produccion
      url:
        description: URL de la aplicación publicada (solo ambiente produccion)
        required: false
        default: ''
      casos:
        description: Solo estos casos (expresión regular; la usa «Volver a ejecutar los fallidos»)
        required: false
        default: ''

permissions:
  contents: read

# Una ejecución a la vez: si se pide otra, espera en cola.
concurrency:
  group: pruebas-e2e
  cancel-in-progress: false

jobs:
  e2e:
    name: Pruebas de la aplicación
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EJECUCION: ${{ inputs.ejecucion }}
      ALCANCE: ${{ inputs.alcance }}
      NAVEGADOR: ${{ inputs.navegador }}
      AMBIENTE: ${{ inputs.ambiente }}
      URL_OBJETIVO: ${{ inputs.url }}
      CASOS: ${{ inputs.casos }}
      HAY_MODELO: ${{ secrets.OPENCODE_API_KEY != '' }}
    steps:
      - name: Descargar el código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validar la solicitud
        id: solicitud
        env:
          HAY_QA: ${{ secrets.QA_USUARIO != '' && secrets.QA_CLAVE != '' }}
        run: |
          set -euo pipefail
          [[ "$EJECUCION" =~ ^(manual|[0-9a-fA-F-]{36})$ ]] || { echo "::error::Identificador de ejecución no válido."; exit 1; }
          [[ "$ALCANCE" =~ ^[a-z-]+$ ]] || { echo "::error::Alcance no válido."; exit 1; }
          ETIQUETA=""
          if [ "$ALCANCE" != "regresion" ]; then ETIQUETA="@$ALCANCE"; fi
          if [ "$AMBIENTE" = "produccion" ]; then
            [ "$ALCANCE" = "basicas" ] || { echo "::error::En producción solo se ejecutan las pruebas básicas."; exit 1; }
            [[ "$URL_OBJETIVO" =~ ^https://[A-Za-z0-9.-]+/?$ ]] || { echo "::error::La URL de producción debe ser https."; exit 1; }
            [ "$HAY_QA" = "true" ] || { echo "::error::Faltan los secrets QA_USUARIO y QA_CLAVE del repositorio."; exit 1; }
          fi
          echo "etiqueta=$ETIQUETA" >> "$GITHUB_OUTPUT"
          mkdir -p reportes-pruebas

      - name: Preparar el navegador y la aplicación
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_PROVIDER_ID: ${{ vars.OPENCODE_PROVIDER_ID || 'opencode-go' }}
          OPENCODE_MODEL_ID: ${{ vars.OPENCODE_MODEL_ID || 'glm-5.3-flash' }}
        run: |
          set -euo pipefail
          if [ "$AMBIENTE" = "pruebas" ]; then
            # Clave del modelo solo para el Agente de Pruebas (las pruebas simulan la API y no la usan).
            if [ -n "$OPENCODE_API_KEY" ]; then
              umask 077
              {
                echo "OPENCODE_API_KEY=$OPENCODE_API_KEY"
                echo "OPENCODE_PROVIDER_ID=$OPENCODE_PROVIDER_ID"
                echo "OPENCODE_MODEL_ID=$OPENCODE_MODEL_ID"
                echo "ANALISTA_TURN_TIMEOUT_SECONDS=300"
              } > .env.docker
            fi
            docker compose --profile pruebas build aplicacion pruebas
            docker compose up --detach --wait aplicacion
          else
            docker compose --profile pruebas build pruebas
          fi

      - name: Ejecutar las pruebas
        id: ejecutar
        env:
          ETIQUETA: ${{ steps.solicitud.outputs.etiqueta }}
          # El usuario de QA solo viaja a producción; en «Pruebas» la API es simulada.
          QA_USUARIO: ${{ inputs.ambiente == 'produccion' && secrets.QA_USUARIO || '' }}
          QA_CLAVE: ${{ inputs.ambiente == 'produccion' && secrets.QA_CLAVE || '' }}
        run: |
          set -euo pipefail
          ARGUMENTOS=()
          if [ -n "$CASOS" ]; then ARGUMENTOS+=(--grep "$CASOS"); elif [ -n "$ETIQUETA" ]; then ARGUMENTOS+=(--grep "$ETIQUETA"); fi
          if [ "$AMBIENTE" = "produccion" ]; then
            BASE_URL="$URL_OBJETIVO" docker compose --profile pruebas run --rm --no-deps pruebas "${ARGUMENTOS[@]}"
          else
            docker compose --profile pruebas run --rm pruebas "${ARGUMENTOS[@]}"
          fi

      - name: Mostrar el registro de la aplicación
        if: failure() && inputs.ambiente == 'pruebas'
        run: docker compose logs aplicacion --tail 200

      - name: Diagnosticar los fallos con el Agente de Pruebas
        if: failure() && steps.ejecutar.outcome == 'failure' && inputs.ambiente == 'pruebas' && env.HAY_MODELO == 'true'
        continue-on-error: true
        timeout-minutes: 20
        run: |
          set -euo pipefail
          sudo chown -R "$(id -u):$(id -g)" reportes-pruebas
          if [ ! -f reportes-pruebas/resumen.json ]; then echo "No hay resumen: nada que diagnosticar."; exit 0; fi
          docker compose --profile diagnostico up --detach --wait navegador
          docker compose exec -T \
            -e NAVEGADOR_MCP_URL=http://navegador:8931/mcp \
            -e BASE_URL_DIAGNOSTICO=http://aplicacion:10000 \
            -e PROBADOR_MAXIMO_CASO="${{ vars.PROBADOR_MAXIMO_CASO || '3' }}" \
            aplicacion python -m agentes.pruebas.diagnosticar \
            < reportes-pruebas/resumen.json > reportes-pruebas/diagnostico.json
          python3 - <<'PY'
          import json, pathlib
          ruta = pathlib.Path("reportes-pruebas/resumen.json")
          resumen = json.loads(ruta.read_text(encoding="utf-8"))
          salida = json.loads(pathlib.Path("reportes-pruebas/diagnostico.json").read_text(encoding="utf-8"))
          for caso in resumen.get("casos", []):
              if caso.get("id") in salida.get("diagnosticos", {}):
                  caso["diagnostico"] = salida["diagnosticos"][caso["id"]]
          resumen["diagnostico"] = {"omitidos": salida.get("omitidos", 0)}
          resumen["consumo"] = salida.get("consumo")
          ruta.write_text(json.dumps(resumen, ensure_ascii=False, indent=2), encoding="utf-8")
          listos = sum(1 for d in salida.get("diagnosticos", {}).values() if d.get("estado") == "listo")
          print(f"Casos con diagnóstico: {listos}")
          consumo = salida.get("consumo") or {}
          print(f"Consumo del Agente de Pruebas: {consumo.get('tokens_total', 0)} tokens, USD {consumo.get('costo_usd', 0)}")
          PY

      - name: Publicar los resultados para el tablero
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: resumen-${{ inputs.ejecucion }}
          path: reportes-pruebas/resumen.json
          if-no-files-found: warn
          retention-days: 30

      - name: Publicar las evidencias
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidencias-${{ inputs.ejecucion }}
          path: reportes-pruebas/
          if-no-files-found: warn
          retention-days: 30

      - name: Publicar el resumen en GitHub
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          ruta = pathlib.Path("reportes-pruebas/resumen.json")
          salida = open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8")
          if not ruta.exists():
              salida.write("### Pruebas automatizadas\n\nNo se generó el resumen: revise el paso «Ejecutar las pruebas».\n")
              raise SystemExit(0)
          datos = json.loads(ruta.read_text(encoding="utf-8"))
          salida.write("### Pruebas automatizadas\n\n")
          salida.write(f"**{datos['aprobados'] + datos['inestables']} de {datos['total']}** casos aprobados · "
                       f"{datos['fallidos']} fallidos · {datos['omitidos']} omitidos · {round(datos['duracion_ms'] / 1000)} s\n\n")
          fallidos = [c for c in datos["casos"] if c["estado"] == "fallido"]
          limpiar = lambda texto: (texto or "").splitlines()[0][:200].replace("|", "\\|") if texto else ""
          if fallidos:
              salida.write("| Caso | Dispositivo | Error | Diagnóstico del Agente de Pruebas |\n|---|---|---|---|\n")
              for caso in fallidos:
                  diagnostico = caso.get("diagnostico") or {}
                  causa = f"{diagnostico.get('tipo', '')}: {diagnostico.get('causa_probable', '')}" if diagnostico.get("estado") == "listo" else ""
                  salida.write(f"| {caso['titulo']} | {caso['dispositivo']} | {limpiar(caso.get('error'))} | {limpiar(causa)} |\n")
          PY

      - name: Apagar la aplicación
        if: always()
        run: |
          docker compose --profile pruebas --profile diagnostico down --volumes
          rm -f .env.docker
